# config/tax/<año>.yaml — Parámetros fiscales (personas físicas, México) para Faro
# INFORMATIVO, NO ES ASESORÍA FISCAL. Faro NO debe calcular impuestos definitivos con esto.
#
# Estado de verificación (2026-10-12):
#   Cada parámetro con status "verificado" se confirmó leyendo el texto oficial completo
#   (PDF de diputados.gob.mx o página de inegi.org.mx), no un extracto de buscador.
#   "evidence" cita el artículo y la frase que lo respalda; "verified_on" es la fecha de lectura.
#   "ambiguo" = el texto oficial no resuelve el punto; queda para el contador
#   (ver docs/sat/verificacion-2026-10.md). "no_verificado" = no se pudo leer la fuente oficial.
#
# Textos oficiales leídos:
#   LISR: https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf (última reforma DOF 01-04-2024)
#   CFF:  https://www.diputados.gob.mx/LeyesBiblio/pdf/CFF.pdf  (última reforma DOF 09-04-2026)
#   LIF 2025: https://www.diputados.gob.mx/LeyesBiblio/abro/lif_2025/Ley_de_Ingresos_2025-Abro.pdf
#             (abrogada a partir del 01-01-2026; texto en el histórico de leyes abrogadas)
#   UMA: https://www.inegi.org.mx/temas/uma/ ; vigencia: LDVUMA art. 5
#        https://www.diputados.gob.mx/LeyesBiblio/pdf/LDVUMA_301216.pdf
#
# Lo carga brain/tax/params.py (cuando exista); los valores con status distinto de
# 'verificado' deben mostrarse en la UI como "no verificado".

year: 2025
params:
  retencion_intereses_tasa_anual:
    value: 0.50
    unit: "% anual sobre el capital que genera los intereses (pago provisional, arts. 54 y 135 LISR)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/abro/lif_2025/Ley_de_Ingresos_2025-Abro.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LIF 2025 art. 21: 'Durante el ejercicio fiscal de 2025 la tasa de retención anual a que se refieren los artículos 54 y 135 de la Ley del Impuesto sobre la Renta será del 0.50 por ciento.'"
    note: ""
  isr_enajenacion_acciones_bolsa_tasa:
    value: 10
    unit: "% sobre ganancia neta del ejercicio, pago definitivo (art. 129 LISR)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 129: pago definitivo 'aplicando la tasa del 10% a las ganancias obtenidas en el ejercicio'; ganancia por cada sociedad emisora y por cada intermediario."
    note: "El costo promedio se actualiza desde la adquisición hasta el mes inmediato anterior a la venta (art. 129 inciso a)."
  perdidas_bolsa_ejercicios_amortizacion:
    value: 10
    unit: "ejercicios siguientes (sólo contra ganancias del mismo art. 129)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 129: la pérdida se disminuye 'contra el monto de la ganancia que en su caso obtenga el mismo contribuyente en el ejercicio o en los diez siguientes'."
    note: "Se actualiza. Si no se disminuye pudiendo hacerlo, se pierde ese derecho hasta por ese monto."
  isr_dividendos_adicional_tasa:
    value: 10
    unit: "% (art. 140 LISR)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 140: impuesto 'adicional del 10% sobre los dividendos o utilidades distribuidos por las personas morales residentes en' México."
    note: ""
  dividendos_factor_piramidacion:
    value: 1.4286
    unit: "factor"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 140: 'multiplicar el dividendo o utilidad percibido por el factor de 1.4286'."
    note: ""
  dividendos_extranjeros_tasa_adicional:
    value: 10
    unit: "% sobre el dividendo efectivamente distribuido por residente en el extranjero, pago definitivo (art. 142 fr. V LISR)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 142 fr. V: además de acumularlos, 'enterar de forma adicional' el ISR de 'multiplicar la tasa del 10%' al dividendo 'sin incluir el monto del impuesto retenido'; definitivo, 'a más tardar el día 17 del mes siguiente'."
    note: "La tasa y el plazo están verificados. Quién retiene vía SIC y cómo se acredita el impuesto extranjero sigue para el contador."
  fibra_retencion_resultado_fiscal_tasa:
    value: 30
    unit: "% sobre resultado fiscal distribuido (art. 188 fr. IV LISR, tasa del art. 9)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 188 fr. IV: retener 'aplicando la tasa del artículo 9'; art. 9: 'la tasa del 30%'. Fr. V: el tenedor acumula 'sin deducir el impuesto retenido' y 'podrán acreditar el impuesto que se les retenga'."
    note: "Acreditable contra el ISR del ejercicio (no definitivo). Si los CBFI cotizan, retiene el intermediario."
  fondos_inversion_renta_variable_tasa_ganancia:
    value: 10
    unit: "% (art. 88 LISR)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 88: 'pagar el impuesto sobre la renta que resulte de aplicar la tasa del 10%' a la ganancia por los activos de renta variable."
    note: ""
  uma_diaria:
    value: 113.14
    unit: "MXN"
    vigencia: "2025-02-01 a 2026-01-31 (enero 2025 usa UMA 2024)"
    source_url: "https://www.inegi.org.mx/temas/uma/"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "INEGI, tabla 'Valor de la UMA': 2025 diario $113.14. Vigencia: LDVUMA art. 5, los valores 'entrarán en vigor dichos valores el 1o. de febrero de dicho año'."
    note: ""
  uma_mensual:
    value: 3439.46
    unit: "MXN"
    source_url: "https://www.inegi.org.mx/temas/uma/"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "INEGI, tabla 'Valor de la UMA': 2025 mensual $3,439.46 (diario x 30.4)."
    note: ""
  uma_anual:
    value: 41273.52
    unit: "MXN"
    source_url: "https://www.inegi.org.mx/temas/uma/"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "INEGI, tabla 'Valor de la UMA': 2025 anual $41,273.52 (mensual x 12)."
    note: ""
  deducciones_personales_tope_umas:
    value: 5
    unit: "UMA anuales (5 x 41,273.52 = 206,367.60 MXN, cálculo propio)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    status: ambiguo
    evidence: "LISR art. 151 último párrafo: 'la cantidad que resulte menor entre cinco veces el valor anual de la Unidad de Medida y Actualización, o del 15% del total de los ingresos'."
    note: "El 5 está verificado. Sigue ambiguo qué UMA anual usar en un ejercicio que cruza el cambio de febrero."
  deducciones_personales_tope_porcentaje:
    value: 15
    unit: "% de ingresos totales, incluidos los exentos"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 151 último párrafo: '15% del total de los ingresos del contribuyente, incluyendo aquéllos por los que no se pague el impuesto. Lo dispuesto en este párrafo no será aplicable tratándose de la fracción V'."
    note: "El art. 151 sólo excluye la fr. V (retiro) del tope global; otras exclusiones que citan fuentes secundarias no están en este artículo."
  afore_voluntarias_tope_porcentaje:
    value: 10
    unit: "% de ingresos acumulables del ejercicio (art. 151 fr. V)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 151 fr. V: 'será de hasta el 10% de los ingresos acumulables del contribuyente en el ejercicio'."
    note: "Fuera del tope global de deducciones (art. 151 último párrafo)."
  afore_voluntarias_tope_umas:
    value: 5
    unit: "UMA anuales"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    status: no_verificado
    evidence: "LISR art. 151 fr. V dice 'cinco salarios mínimos generales del área geográfica del contribuyente elevados al año'."
    note: "La ley no se reformó al texto UMA; la equivalencia salario mínimo -> UMA viene del decreto constitucional de 2016 (no leído aquí)."
  art185_cuentas_especiales_ahorro_tope:
    value: 152000
    unit: "MXN"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 185: no podrá 'exceder en el año de calendario de que se trate, del equivalente a $152,000.00'."
    note: ""
  declaracion_anual_fecha_limite:
    value: "2025-04-30"
    unit: "fecha (por el ejercicio 2024; mes de abril, art. 150 LISR)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 150: declaración 'que presentarán en el mes de abril del año siguiente'. El 30 de abril de 2025 fue miércoles (sin prórroga por CFF art. 12)."
    note: ""
  declaracion_anual_ejercicio_2025_fecha_limite:
    value: "2026-04-30"
    unit: "fecha (por el ejercicio 2025)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 150: declaración 'que presentarán en el mes de abril del año siguiente'. El 30 de abril de 2026 fue jueves."
    note: "El artículo del SAT (gob.mx, 06-04-2026) no enuncia las fechas; el fundamento es el art. 150."
  ingresos_intereses_umbral_declaracion:
    value: 100000
    unit: "MXN de intereses reales"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 150: no declaran quienes sólo tengan ingresos de los Capítulos I y VI hasta $400,000.00, 'siempre que los ingresos por concepto de intereses reales no excedan de $100,000.00' y se haya retenido conforme al art. 135."
    note: ""
  salarios_umbral_declaracion:
    value: 400000
    unit: "MXN (salarios + intereses)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 150: ingresos de los Capítulos I y VI 'cuya suma no exceda de $400,000.00'."
    note: ""
  resico_tope_ingresos:
    value: 3500000
    unit: "MXN anuales (art. 113-E LISR)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "LISR art. 113-E: ingresos del ejercicio inmediato anterior que 'no hubieran excedido de la cantidad de tres millones quinientos mil pesos'."
    note: ""
  enajenacion_bienes_muebles_exencion_umas:
    value: 3
    unit: "salarios mínimos anuales de ganancia (art. 93 fr. XIX inciso b)"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf"
    consulted: 2026-10-12
    status: ambiguo
    evidence: "LISR art. 93 fr. XIX b): bienes muebles 'distintos de las acciones, de las partes sociales, de los títulos valor y de las inversiones del contribuyente', ganancia que 'no exceda de tres veces el salario mínimo general ... elevado al año'."
    note: "El texto dice salario mínimo, no UMA. Si cripto es 'inversión' (y queda excluida) es interpretación: contador."
  tipo_cambio_regla:
    value: "Tipo de cambio al que se adquirió la divisa; sin adquisición, el que Banxico publique en el DOF el día anterior a la causación; si ese día no hay publicación, el último publicado (art. 20 CFF)"
    unit: "regla"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CFF.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "CFF art. 20: 'se considerará el tipo de cambio a que se haya adquirido la moneda extranjera de que se trate y no habiendo adquisición, se estará al tipo de cambio que el Banco de México publique en el Diario Oficial de la Federación el día anterior'."
    note: "Corregido: antes decía sólo el FIX del día anterior."
  factor_actualizacion_regla:
    value: "INPC del mes anterior al más reciente del periodo / INPC del mes anterior al más antiguo; si < 1, se usa 1 (art. 17-A CFF)"
    unit: "regla"
    source_url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CFF.pdf"
    consulted: 2026-10-12
    verified_on: 2026-10-12
    status: verificado
    evidence: "CFF art. 17-A: 'dividiendo el Indice Nacional de Precios al Consumidor del mes anterior al más reciente del periodo entre el citado índice correspondiente al mes anterior al más antiguo'; 'sea menor a 1 ... será 1'."
    note: "Corregido: antes decía 'INPC reciente / INPC antiguo' (desfase de un mes). Cada artículo de la LISR fija sus propios meses (p. ej. art. 129)."
