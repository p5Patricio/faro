#   VERIFICADO    = la fecha se leyó en la fuente oficial completa el día indicado en "checked"
#                   (texto de ley, calendario oficial o página del organismo; no un extracto de buscador).
#   REPORTADO     = fuente secundaria o no se volvió a revisar.
